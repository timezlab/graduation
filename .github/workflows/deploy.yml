# Dựng trang tĩnh và đưa lên GitHub Pages mỗi khi đẩy lên nhánh main.
#
# Trong Settings → Pages của repo, mục Source phải chọn "GitHub Actions"
# (không phải "Deploy from a branch"), và mục Custom domain điền đúng tên
# miền trong public/CNAME. DNS: bản ghi CNAME `graduation` trỏ về
# `timezlab.github.io`.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Chỉ một lượt deploy chạy tại một thời điểm; lượt mới huỷ lượt đang xếp hàng
# nhưng không cắt ngang lượt đang chạy dở.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
